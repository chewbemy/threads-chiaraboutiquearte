name: Threads post

on:
  workflow_dispatch:        # avviato da cron-job.org (o a mano dal tab Actions)
    inputs:
      dry_run:
        description: "Solo prova: genera testo e video senza pubblicare"
        type: boolean
        default: false

concurrency:
  group: threads-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Genera e pubblica
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python bot.py

      - name: Salva lo stato
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato."
          else
            git commit -m "state: post $(date -u +%FT%H:%M)"
            git pull --rebase
            git push
          fi
